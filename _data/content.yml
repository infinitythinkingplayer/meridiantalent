why:
  # 服务差异
  f01:
    zh: "服务差异"
    en: "How we differ"
  # 把分散的环节，收在一条时间表上
  f02:
    zh: "把分散的环节，收在一条时间表上"
    en: "Bringing scattered workstreams onto one timeline"
  # 赴澳落地出问题，往往不在招聘这一步，而在招到人之后：…
  f03:
    zh: "赴澳落地出问题，往往不在招聘这一步，而在招到人之后：合同条款、薪酬分类、超年金与申报、外派与本地员工的工作习惯差异、核心岗位的留存。这些环节通常分散在不同供应商手里，衔接的责任最后落回企业自己身上。"
    en: "Australian landings usually run into trouble after the hire, not before it: contract terms, award classification, superannuation and reporting, differences in working norms between expat and local staff, and retention in key roles. These pieces usually sit with different providers, and joining them up ends up falling to the company itself."
  # 分别向多家供应商采购
  f04:
    zh: "分别向多家供应商采购"
    en: "Buying from several providers separately"
  # 由 MERIDIAN TALENT 统一协调
  f05:
    zh: "由 MERIDIAN TALENT 统一协调"
    en: "Coordinated by MERIDIAN TALENT"
  # 服务起点
  f06:
