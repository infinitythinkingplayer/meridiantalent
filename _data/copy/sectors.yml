# 五个行业组，新能源是我们最深的一条
f02:
  zh: "五个行业组，新能源是我们最深的一条"
  en: "Five sector desks. New energy is the deepest of them."

# 同一个职位名称，在不同行业里是完全不同的人。所以顾问…
f03:
  zh: "同一职位名称在不同行业中对应的人才要求差异很大。因此顾问按行业而非职能分组，既了解贵司的项目，也能准确评估候选人的专业背景。"
  en: "The same job title calls for a different professional in a different industry. Our consultants are therefore organised by sector rather than function: they understand the client’s projects and can assess a candidate’s background accurately."

